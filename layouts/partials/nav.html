<header class="site-header" role="banner">
  <div class="site-title"><a href="{{ "/" | relURL }}">{{ .Site.Title }}</a></div>
  <nav class="site-nav" aria-label="Site">
    <ul>
      {{ $current := . }}
      {{ range .Site.Menus.main }}
      {{ $exact := $current.IsMenuCurrent "main" . }}
      {{ $active := or $exact ($current.HasMenuCurrent "main" .) }}
      <li><a href="{{ .URL | relURL }}"{{ if $active }} class="active"{{ end }}{{ if $exact }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </nav>
</header>
