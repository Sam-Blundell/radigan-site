<table>
  {{- with .THead }}
  <thead>
    {{- range . }}
    <tr>
      {{- range . }}
      <th scope="col">{{ .Text }}</th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  {{- end }}
  {{- with .TBody }}
  <tbody>
    {{- range . }}
    <tr>
      {{- range . }}
      <td>{{ .Text }}</td>
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
  {{- end }}
</table>
